name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: supercool
          POSTGRES_USER: supercool
          POSTGRES_PASSWORD: supercool
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U supercool -d supercool"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://supercool:supercool@127.0.0.1:54329/supercool
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run openapi:generate
      - run: git diff --exit-code -- openapi.json
      - name: Scan tracked text for secret patterns
        run: |
          if git grep -nE '(ghp_[A-Za-z0-9]{20,}|xi-api-key[=:][[:space:]]*[A-Za-z0-9])' -- ':!docs/ai-usage/**'; then
            exit 1
          fi

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build --tag supercool-ledger:ci .
      - run: docker image inspect supercool-ledger:ci
