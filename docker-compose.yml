services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: supercool
      POSTGRES_USER: supercool
      POSTGRES_PASSWORD: supercool
    ports:
      - '54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U supercool -d supercool']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
